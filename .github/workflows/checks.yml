# The merge checklist from AGENTS.md, on every PR and every push to main: the repo check (with the Worker tests), the model
# tests, the proof-read, the Firestore rules in the emulator, and the browser test at phone size with axe.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.1.0
      - uses: flamingbeing/app-devkit/setup-tools@v1.6.0
      - name: Repo check (and Worker tests)
        run: node .devkit/tools/check.mjs
      - name: Model tests
        run: node test/model.test.mjs
      - name: Sending through app-sync (outbox, status, sign-out) and the version pins
        run: node --test test/sync.test.mjs
      - name: The shared store through cloud.js (every read and write path)
        run: node --test test/store.test.mjs
      - name: Proof-read (pages and documents)
        run: node .devkit/tools/proofread.mjs

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.1.0
      - name: Cache rules test tools and emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anawj-rules
            ~/.cache/firebase/emulators
          key: rules-${{ runner.os }}-${{ hashFiles('tools/test-rules.sh') }}
      - name: Firestore rules (local emulator, demo project)
        run: bash tools/test-rules.sh

  browser:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no browser deps for ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.1.0
      - name: Install Playwright and axe
        run: npm install -g playwright@1.56.1 axe-core@4
      - uses: flamingbeing/app-devkit/setup-browser@v1.1.0
        with:
          playwright-version: '1.56.1'
          devkit-dir: ''
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs" AXE_PATH="$(npm root -g)/axe-core/axe.min.js"
          node test/e2e.mjs
